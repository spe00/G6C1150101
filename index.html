    <style>
        :root {
            --bg-dark: #141726;
            --panel-bg: #22263a;
            --border-gold: #f1c40f;
            --text-light: #f5f6fa;
            --accent-blue: #3498db;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --selected-bg: #2980b9;
        }
        * {
            box-sizing: border-box;
            font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
        }
        body {
            background: radial-gradient(circle at top, #1f2742 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .game-container {
            width: 100%;
            max-width: 880px;
            background-color: var(--panel-bg);
            border: 4px solid var(--border-gold);
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.7);
            position: relative;
        }
        /* 頂部狀態列 */
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 14px 20px;
            border-radius: 12px;
            border: 2px solid #485460;
            margin-bottom: 18px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .stat-box {
            font-size: 1.15rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .score-highlight {
            color: var(--border-gold);
            font-size: 1.5rem;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }
        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
            background: rgba(255,255,255,0.04);
            padding: 10px 16px;
            border-radius: 10px;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1rem;
        }
        select, .jump-select {
            background: #2f3640;
            color: #fff;
            border: 1px solid var(--border-gold);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }
        /* 魔王舞台區 */
        .monster-stage {
            background: linear-gradient(135deg, #192a56, #0c1836);
            border: 3px solid var(--border-gold);
            border-radius: 14px;
            padding: 16px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .monster-icon {
            font-size: 4rem;
            margin-bottom: 4px;
            display: inline-block;
            animation: float 2.4s ease-in-out infinite;
            transition: transform 0.2s;
        }
        .monster-hit {
            animation: hitShake 0.4s ease-in-out !important;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }
        @keyframes hitShake {
            0%, 100% { transform: translateX(0) scale(1); }
            25% { transform: translateX(-12px) scale(0.9) rotate(-8deg); filter: brightness(2) hue-rotate(90deg); }
            75% { transform: translateX(12px) scale(1.1) rotate(8deg); }
        }
        .monster-name {
            font-size: 1.25rem;
            font-weight: bold;
            color: #ffda79;
            margin-bottom: 8px;
        }
        .hp-bar-outer {
            width: 80%;
            max-width: 420px;
            height: 16px;
            background: #2f3640;
            border-radius: 10px;
            margin: 0 auto;
            border: 2px solid #dcdde1;
            overflow: hidden;
        }
        .hp-bar-inner {
            height: 100%;
            background: linear-gradient(90deg, #ff5252, #ff793f);
            width: 100%;
            transition: width 0.4s ease;
        }
        /* 題目與選項區 */
        .question-card {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid #57606f;
            border-radius: 14px;
            padding: 22px;
        }
        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 18px;
        }
        .question-text {
            font-size: 1.4rem;
            line-height: 1.65;
            font-weight: bold;
            flex: 1;
            letter-spacing: 0.5px;
        }
        .tts-btn {
            background-color: #f39c12;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 1.05rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 0 #d68910;
            transition: transform 0.1s;
        }
        .tts-btn:hover {
            background-color: #f1c40f;
            color: #1e272e;
        }
        .tts-btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #d68910;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-row {
            display: flex;
            align-items: stretch;
            gap: 10px;
        }
        .option-btn {
            flex: 1;
            background-color: #2f3640;
            color: var(--text-light);
            border: 2px solid #718093;
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1.25rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            line-height: 1.45;
        }
        .option-btn:hover:not(:disabled) {
            background-color: #3d4656;
            border-color: var(--border-gold);
        }
        .option-btn.selected {
            background-color: var(--selected-bg);
            border-color: var(--border-gold);
            box-shadow: 0 0 14px rgba(241, 196, 15, 0.55);
            font-weight: bold;
        }
        .option-btn.correct {
            background-color: #218c74 !important;
            border-color: #33d9b2 !important;
            color: #fff !important;
        }
        .option-btn.wrong {
            background-color: #b33939 !important;
            border-color: #ff5252 !important;
            color: #fff !important;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-top: 22px;
        }
        .submit-btn, .next-btn {
            width: 100%;
            padding: 16px;
            font-size: 1.35rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .submit-btn {
            background-color: var(--accent-green);
            color: #1e272e;
            box-shadow: 0 5px 0 #218c74;
        }
        .submit-btn:disabled {
            background-color: #57606f;
            color: #a4b0be;
            cursor: not-allowed;
            box-shadow: none;
        }
        .next-btn {
            background-color: var(--border-gold);
            color: #1e272e;
            box-shadow: 0 5px 0 #b7950b;
            display: none;
        }
        .feedback-box {
            margin-top: 18px;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            display: none;
            line-height: 1.6;

            color: #7bed9f;
        }
        .feedback-wrong {
            background-color: rgba(231, 76, 60, 0.2);
            border: 2px solid var(--accent-red);
            color: #ff7f50;
        }
        .footer-credit {
            margin-top: 16px;
            font-size: 0.95rem;
            color: #a4b0be;
            text-align: center;

    </style>
</head>

    </div>

    <div class="question-card">

    </div>

</div>

// 合成音效 (Web Audio API)
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playSound(type) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'correct') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(523.25, now); // C5
        osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
        osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.45);
        osc.start(now);
        osc.stop(now + 0.45);
    } else if (type === 'wrong') {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.setValueAtTime(160, now + 0.15);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
    }
}

function initJumpMenu() {
    const sel = document.getElementById("jump-select");
    sel.innerHTML = "";
    questions.forEach((item, idx) => {
        const opt = document.createElement("option");
        opt.value = idx;
        const label = idx < 17 ? `一、選擇 第 ${idx + 1} 題` : `二、語意 第 ${idx - 16} 題`;
        opt.textContent = label;
        sel.appendChild(opt);
    });
}

function jumpToQuestion(idx) {
    window.speechSynthesis.cancel();
    currentIdx = parseInt(idx, 10);
    loadQuestion();
}

function speakText(text) {
    if (!('speechSynthesis' in window)) {
        alert("您的瀏覽器不支援語音報讀功能！");
        return;
    }
    window.speechSynthesis.cancel();

    // 將注音與特殊符號轉換為自然語音可讀的字詞，確保報讀清晰
    const cleanText = text
        .replace(/□□/g, "空格")
        .replace(/□/g, "空格")
        .replace(/①/g, "選項一，")
        .replace(/②/g, "選項二，")
        .replace(/③/g, "選項三，")
        .replace(/④/g, "選項四，")
        .replace(/→/g, " 變成 ")
        .replace(/／/g, "，")
        .replace(/ㄈㄣˋ/g, "憤（四聲憤）")
        .replace(/ㄆㄣ/g, "噴（一聲噴）")
        .replace(/ㄈㄣˇ/g, "粉（三聲粉）")
        .replace(/ㄏㄨㄤˇ/g, "恍（三聲恍）")
        .replace(/ㄏㄨㄤˋ/g, "晃（四聲晃）")
        .replace(/ㄈㄨˇ/g, "撫（三聲撫）")
        .replace(/ㄈㄨˊ/g, "福（二聲福）")
        .replace(/ㄏㄨㄥˋ/g, "鬨（四聲鬨）")
        .replace(/ㄏㄨㄥˇ/g, "哄（三聲哄）")
        .replace(/ㄏㄨㄥ/g, "轟（一聲轟）")
        .replace(/ㄇㄟˋ/g, "魅（四聲魅）")
        .replace(/ㄇㄛˋ/g, "末（四聲末）");

    const utter = new SpeechSynthesisUtterance(cleanText);
    utter.lang = "zh-TW";
    const rateSelect = document.getElementById("tts-rate");
    utter.rate = rateSelect ? parseFloat(rateSelect.value) : 0.9;
    window.speechSynthesis.speak(utter);
}

function speakQuestion() {
    speakText(questions[currentIdx].q);
}

function updateHeroTitle() {
    const titleEl = document.getElementById("hero-title");
    if (score >= 90) titleEl.textContent = "👑 傳說語文聖騎士";
    else if (score >= 70) titleEl.textContent = "⚔️ 皇家大劍師";
    else if (score >= 40) titleEl.textContent = "🛡️ 菁英冒險者";
    else titleEl.textContent = "🌱 見習冒險者";
}

function loadQuestion() {
    answered = false;
    selectedOption = null;
    const item = questions[currentIdx];

    document.getElementById("jump-select").value = currentIdx;
    document.getElementById("progress-text").textContent = `${currentIdx + 1} / ${questions.length}`;
    document.getElementById("monster-icon").textContent = item.icon;
    document.getElementById("monster-name").textContent = item.section;
    document.getElementById("question-text").textContent = item.q;

    // 更新魔王血量條 (隨進度遞減)
    const remainingRatio = Math.max(5, Math.round(((questions.length - currentIdx) / questions.length) * 100));
    document.getElementById("hp-bar").style.width = remainingRatio + "%";

    const optionsContainer = document.getElementById("options-container");
    optionsContainer.innerHTML = "";

    item.options.forEach((opt, idx) => {
        const row = document.createElement("div");
        row.className = "option-row";

        const optBtn = document.createElement("button");
        optBtn.className = "option-btn";
        optBtn.textContent = opt;
        optBtn.onclick = () => selectOption(idx);

        const ttsBtn = document.createElement("button");
        ttsBtn.className = "tts-btn";
        ttsBtn.innerHTML = "🔊 報讀";
        ttsBtn.onclick = (e) => {
            e.stopPropagation();
            speakText(opt);
        };

        row.appendChild(optBtn);
        row.appendChild(ttsBtn);
        optionsContainer.appendChild(row);
    });

    document.getElementById("submit-btn").disabled = true;
    document.getElementById("submit-btn").style.display = "block";
    document.getElementById("next-btn").style.display = "none";
    const fb = document.getElementById("feedback-box");
    fb.style.display = "none";
}

function selectOption(idx) {
    if (answered) return;
    selectedOption = idx;
    const btns = document.querySelectorAll(".option-btn");
    btns.forEach((b, i) => {
        b.classList.toggle("selected", i === idx);
    });
    document.getElementById("submit-btn").disabled = false;
}

function confirmAnswer() {
    if (selectedOption === null || answered) return;
    answered = true;
    const item = questions[currentIdx];
    const btns = document.querySelectorAll(".option-btn");
    const fb = document.getElementById("feedback-box");
    const monsterIcon = document.getElementById("monster-icon");

    if (selectedOption === item.answer) {
        playSound('correct');
        monsterIcon.classList.add("monster-hit");
        setTimeout(() => monsterIcon.classList.remove("monster-hit"), 450);

        if (!answeredStatus[currentIdx]) {
            score += item.points;
            answeredStatus[currentIdx] = true;
        }
        document.getElementById("score-text").textContent = score;
        updateHeroTitle();
        btns[selectedOption].classList.add("correct");
        fb.className = "feedback-box feedback-correct";
        fb.innerHTML = `✨ 攻擊成功！獲得 ${item.points} 積分！<br>💡 解析：${item.exp}`;
        speakText(`答對了！獲得 ${item.points} 分。${item.exp}`);
    } else {
        playSound('wrong');
        btns[selectedOption].classList.add("wrong");
        btns[item.answer].classList.add("correct");
        fb.className = "feedback-box feedback-wrong";
        fb.innerHTML = `💥 攻擊失誤！正確答案為：${item.options[item.answer]}<br>💡 解析：${item.exp}`;
        speakText(`答錯了！正確答案是 ${item.options[item.answer]}。${item.exp}`);
    }

    fb.style.display = "block";
    document.getElementById("submit-btn").style.display = "none";
    const nextBtn = document.getElementById("next-btn");
    nextBtn.style.display = "block";
    if (currentIdx === questions.length - 1) {
        nextBtn.textContent = "🏆 查看冒險總結成績";
    } else {
        nextBtn.textContent = "➡️ 前往下一關";
    }
}

function nextQuestion() {
    window.speechSynthesis.cancel();
    if (currentIdx < questions.length - 1) {
        currentIdx++;
        loadQuestion();
    } else {
        showFinalSummary();
    }
}

function showFinalSummary() {
    const gameBox = document.getElementById("game-box");
    let rank = "🌱 努力不懈的見習勇者";
    if (score >= 90) rank = "👑 傳說級國語文聖騎士";
    else if (score >= 75) rank = "⚔️ 榮耀皇家大劍師";
    else if (score >= 60) rank = "🛡️ 堅毅冒險勇者";

    gameBox.innerHTML = `
        <div style="text-align:center; padding: 35px 15px;">
            <div style="font-size: 5rem; margin-bottom: 10px;">🏆</div>
            <h1 style="color: var(--border-gold); font-size: 2.3rem;">冒險試煉完成！</h1>
            <p style="font-size: 1.6rem; margin: 18px 0;">最終累計積分：<span style="color:var(--border-gold); font-size: 2.4rem; font-weight:bold;">${score}</span> / 100 分</p>
            <p style="font-size: 1.5rem; color: #7bed9f; margin-bottom: 35px;">獲得稱號：${rank}</p>
            <button class="submit-btn" style="max-width:320px; margin: 0 auto;" onclick="location.reload()">🔄 重新展開冒險</button>
        </div>
    `;
    speakText(`恭喜完成冒險試煉！您的最終累計積分為 ${score} 分，獲得稱號：${rank}`);
}

window.onload = () => {
    initJumpMenu();
    loadQuestion();
};
</script>

</body>
</html>
